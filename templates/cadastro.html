<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Help Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container"><div class="row justify-content-center"><div class="col-md-5">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4">Novo Usuário</h3>
            <form action="/cadastro" method="post">
                <div class="mb-3"><label class="form-label">Nome</label><input type="text" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">E-mail</label><input type="email" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Senha</label><input type="password" class="form-control" required></div>
                <button type="submit" class="btn btn-success w-100">Cadastrar</button>
                <div class="text-center mt-3"><a href="/">Voltar para Login</a></div>
            </form>
        </div>
    </div></div></div>
</body>
</html>
