<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <div class="container card shadow p-4">
        <h2>Listagem de Chamados (Help Desk)</h2>
        <p class="text-muted">Status em tempo real dos atendimentos.</p>
        <table class="table table-hover mt-4">
            <thead class="table-dark"><tr><th>ID</th><th>Solicitante</th><th>Problema</th><th>Status</th></tr></thead>
            <tbody>
                <tr><td>001</td><td>Marivaldo Lopes</td><td>Erro no acesso ao Linux</td><td><span class="badge bg-warning text-dark">Pendente</span></td></tr>
                <tr><td>002</td><td>Suporte IFTO</td><td>Atualização de Sistema</td><td><span class="badge bg-success">Concluído</span></td></tr>
            </tbody>
        </table>
        <a href="/" class="btn btn-outline-danger btn-sm">Sair</a>
    </div>
</body>
</html>
