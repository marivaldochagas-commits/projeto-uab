<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zil Suporte - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-cadastro { width: 100%; max-width: 400px; border: none; border-radius: 12px; }
    </style>
</head>
<body>

<div class="card card-cadastro shadow-sm p-4 bg-white">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-dark">Criar Conta</h3>
        <p class="text-muted small">Cadastre-se para abrir chamados na Zil</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} p-2 small text-center" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('pages.cadastro') }}" method="POST">
        <div class="mb-3">
            <label for="nome" class="form-label small fw-semibold text-secondary">Nome Completo</label>
            <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label small fw-semibold text-secondary">E-mail</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>
        <div class="mb-3">
            <label for="senha" class="form-label small fw-semibold text-secondary">Senha</label>
            <input type="password" class="form-control" id="senha" name="senha" placeholder="Crie uma senha" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold mb-3">Cadastrar</button>
    </form>

    <div class="text-center">
        <a href="{{ url_for('pages.index') }}" class="small text-decoration-none">Já tem uma conta? Faça Login</a>
    </div>
</div>

</body>
</html>
